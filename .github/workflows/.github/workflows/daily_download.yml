name: ULTY Daily Auto Downloader

on:
  schedule:
    # 매일 한국 시간 오전 07:00 자동 실행 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager

    - name: Run Downloader Script
      run: python main.py

    - name: Setup Rclone
      uses: rclone/rclone-python-action@v1

    - name: Upload to Google Drive via Rclone
      env:
        RCLONE_CONFIG_GDRIVE_TYPE: drive
        RCLONE_CONFIG_GDRIVE_SCOPE: drive
        RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
      run: |
        rclone copy ./downloads gdrive:${{ secrets.GDRIVE_FOLDER_ID }} --verbose
